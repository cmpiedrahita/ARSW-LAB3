version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blueprints-postgres
    environment:
      POSTGRES_DB: blueprintsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - blueprints-network

volumes:
  postgres_data:

networks:
  blueprints-network:
    driver: bridge
